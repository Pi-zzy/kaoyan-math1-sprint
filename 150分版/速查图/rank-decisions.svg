<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img"><title>方程组秩与解数的逻辑树</title><desc>由系数与增广矩阵秩是否相等，再比较秩与未知数个数，得到三种解数结论。</desc><rect width="900" height="390" fill="white"/><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 10L10 0" stroke="#94a3b8" stroke-width="1"/></pattern></defs><g font-family="'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" fill="#1e293b"><text x="26" y="35" font-size="23" text-anchor="start">Ax=b：先等秩，再数自由变量</text><rect x="235" y="70" width="430" height="68" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="450.0" y="110.0" font-size="17" text-anchor="middle">先比较 r(A) 与 r(A,b)</text><rect x="38" y="206" width="265" height="82" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="170.5" y="253.0" font-size="17" text-anchor="middle">不等秩 → 无解</text><rect x="338" y="206" width="245" height="82" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="460.5" y="253.0" font-size="17" text-anchor="middle">等秩且 r=n → 唯一解</text><rect x="615" y="206" width="250" height="82" rx="8" fill="#f8fafc" stroke="#334155" stroke-width="2"/><text x="740.0" y="253.0" font-size="17" text-anchor="middle">等秩且 r&lt;n → 无穷多解</text><line x1="450" y1="139" x2="170" y2="204" stroke="#25364c" stroke-width="2" stroke-dasharray="7 5"/><line x1="450" y1="139" x2="460" y2="204" stroke="#25364c" stroke-width="2"/><line x1="450" y1="139" x2="740" y2="204" stroke="#25364c" stroke-width="2"/><text x="70" y="326" font-size="17" text-anchor="start">有解条件：r(A)=r(A,b)</text><text x="450" y="356" font-size="18" text-anchor="middle">自由变量数 n−r(A)，n 是未知数个数</text></g></svg>