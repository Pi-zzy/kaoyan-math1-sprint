nchor="middle">0</text><text x="220.0" y="340" font-size="16" text-anchor="middle">0.25</text><text x="330.0" y="340" font-size="16" text-anchor="middle">0.5</text><text x="440.0" y="340" font-size="16" text-anchor="middle">0.75</text><text x="550" y="340" font-size="16" text-anchor="middle">1</text><text x="93" y="207" font-size="16" text-anchor="end">1</text><text x="93" y="95" font-size="16" text-anchor="end">2</text><text x="665" y="143" font-size="20" text-anchor="start">总面积 = 1</text><text x="665" y="196" font-size="20" text-anchor="start">阴影面积 = 1/2</text><text x="665" y="248" font-size="20" text-anchor="start">单点概率 = 0</text><text x="665" y="290" font-size="17" text-anchor="start">f(1/2)=1 只是高度</text><line x1="330.0" y1="314" x2="330.0" y2="202" stroke="#be123c" stroke-width="2" stroke-dasharray="7 5"/></g></svg>