<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="510" viewBox="0 0 900 510" role="img" aria-labelledby="title description">
  <title id="title">An oblique idempotent projection</title>
  <desc id="description">The range is y=0; the kernel is x+y=0. The error from v to Pv is not perpendicular to the range.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="black" />
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="white" />
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="black" stroke-width="0.65" />
    </pattern>
    <pattern id="crosshatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="white" />
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="black" stroke-width="0.65" />
      <path d="M-2 8 L2 12 M0 0 L10 10 M8 -2 L12 2" stroke="black" stroke-width="0.65" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="900" height="510" fill="white" />
  <text x="45" y="38" font-size="22" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">R16: idempotent does not mean orthogonal</text>
  <line x1="130.0" y1="286.8181818181818" x2="500.0" y2="286.8181818181818" stroke="black" stroke-width="1.6" marker-end="url(#arrow)" />
  <line x1="298.1818181818182" y1="455.0" x2="298.1818181818182" y2="85.0" stroke="black" stroke-width="1.6" marker-end="url(#arrow)" />
  <text x="514" y="292.8181818181818" font-size="19" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">x</text>
  <text x="282.1818181818182" y="71" font-size="19" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">y</text>
  <line x1="163.63636363636363" y1="282.8181818181818" x2="163.63636363636363" y2="290.8181818181818" stroke="black" stroke-width="1" />
  <text x="163.63636363636363" y="309.8181818181818" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal" fill="black">-1</text>
  <line x1="294.1818181818182" y1="421.3636363636364" x2="302.1818181818182" y2="421.3636363636364" stroke="black" stroke-width="1" />
  <text x="289.1818181818182" y="426.3636363636364" font-size="14" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal" fill="black">-1</text>
  <line x1="298.1818181818182" y1="282.8181818181818" x2="298.1818181818182" y2="290.8181818181818" stroke="black" stroke-width="1" />
  <line x1="294.1818181818182" y1="286.8181818181818" x2="302.1818181818182" y2="286.8181818181818" stroke="black" stroke-width="1" />
  <line x1="432.72727272727275" y1="282.8181818181818" x2="432.72727272727275" y2="290.8181818181818" stroke="black" stroke-width="1" />
  <text x="432.72727272727275" y="309.8181818181818" font-size="14" text-anchor="middle" font-family="Arial, sans-serif" font-weight="normal" fill="black">1</text>
  <line x1="294.1818181818182" y1="152.27272727272725" x2="302.1818181818182" y2="152.27272727272725" stroke="black" stroke-width="1" />
  <text x="289.1818181818182" y="157.27272727272725" font-size="14" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal" fill="black">1</text>
  <text x="286.1818181818182" y="307.8181818181818" font-size="14" text-anchor="end" font-family="Arial, sans-serif" font-weight="normal" fill="black">0</text>
  <line x1="143.45454545454547" y1="286.8181818181818" x2="473.09090909090907" y2="286.8181818181818" stroke="black" stroke-width="3" />
  <line x1="150.18181818181816" y1="138.8181818181818" x2="446.1818181818182" y2="434.8181818181818" stroke="black" stroke-width="2" stroke-dasharray="8 6" />
  <line x1="298.1818181818182" y1="152.27272727272725" x2="432.72727272727275" y2="286.8181818181818" stroke="black" stroke-width="1.8" marker-end="url(#arrow)" />
  <circle cx="298.1818181818182" cy="152.27272727272725" r="4" fill="black" />
  <text x="311.1818181818182" y="142.27272727272725" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">v=(0,1)</text>
  <circle cx="432.72727272727275" cy="286.8181818181818" r="4" fill="black" />
  <text x="439.72727272727275" y="274.8181818181818" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">Pv=(1,0)</text>
  <circle cx="298.1818181818182" cy="286.8181818181818" r="4" fill="black" />
  <text x="307.1818181818182" y="306.8181818181818" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">O</text>
  <rect x="635" y="90" width="230" height="300" fill="white" stroke="black" stroke-width="1" />
  <text x="648" y="124" font-size="18" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">P=[[1,1],[0,0]]</text>
  <text x="648" y="163" font-size="17" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">P^2=P, P^T!=P</text>
  <text x="648" y="205" font-size="17" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">Solid: Im(P), y=0</text>
  <text x="648" y="239" font-size="17" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">Dashed: Ker(P)</text>
  <text x="648" y="268" font-size="17" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">x+y=0</text>
  <text x="648" y="310" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">Pv dot (v-Pv) = -1</text>
  <text x="648" y="353" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">Nearest point to v: O</text>
  <text x="70" y="470" font-size="18" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">The arrow is parallel to Ker(P), not perpendicular to Im(P).</text>
</svg>