<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" role="img" aria-labelledby="title description">
  <title id="title">Straight paths versus a curved path</title>
  <desc id="description">For x^2*y/(x^4+y^2), a straight ray tends to zero but y=x^2 has value one half away from the origin.</desc>
