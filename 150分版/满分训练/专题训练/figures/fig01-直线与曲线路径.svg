  <circle cx="261.79245283018867" cy="373.13657407407413" r="4" fill="black" />
  <text x="277.79245283018867" y="393.13657407407413" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">A=(t,t^2)</text>
  <circle cx="340.37735849056605" cy="253.51851851851853" r="4" fill="black" />
