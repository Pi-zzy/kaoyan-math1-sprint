  <text x="643" y="122" font-size="18" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">Dashed: y=x</text>
  <text x="643" y="156" font-size="16" text-anchor="start" font-family="Arial, sans-serif" font-weight="normal" fill="black">f(t,t)=t/(1+t^2)</text>
