<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title description">
  <title id="title">Support transformation and the event region</title>
  <desc id="description">The triangular support 0&lt;x&lt;y&lt;1 maps bijectively to 0&lt;u,v&lt;1 by u=x/y,v=y. Crosshatching denotes x&lt;y/2,y&gt;1/2 and the corresponding rectangle.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="black" />
    </marker>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="white" />
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="black" stroke-width="0.65" />
    </pattern>
    <pattern id="crosshatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="white" />
      <path d="M-2 2 L2 -2 M0 10 L10 0 M8 12 L12 8" stroke="black" stroke-width="0.65" />
      <path d="M-2 8 L2 12 M0 0 L10 10 M8 -2 L12 2" stroke="black" stroke-width="0.65" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="1000" height="540" fill="white" />
  <text x="35" y="38" font-size="22" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">S14: support and event limits must transform together</text>
  <text x="80" y="83" font-size="19" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">(x,y): 0&lt;x&lt;y&lt;1</text>
  <text x="590" y="83" font-size="19" text-anchor="start" font-family="Arial, sans-serif" font-weight="bold" fill="black">(u,v): 0&lt;u&lt;1, 0&lt;v&lt;1</text>
