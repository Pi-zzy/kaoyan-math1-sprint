<svg xmlns="http://www.w3.org/2000/svg" width="720" height="475.2" viewBox="0 0 1000 660" role="img" aria-labelledby="title description">
<title id="title">Mock 04 Q20: spherical cap and orientations</title>
<desc id="description">Meridional section in orthonormal v,u coordinates. Unit sphere cut at u=1/sqrt(3). The thick solid cap has a normal arrow toward the origin. The supplementary disk has outward normal along negative u. The remaining sphere is dashed, the disk section dash-dot, and the cap volume hatched.</desc>
<metadata id="geometry">{&quot;axes&quot;: [&quot;v&quot;, &quot;u&quot;], &quot;base_normal_end&quot;: [-0.3, 0.27735026918962585], &quot;base_normal_start&quot;: [-0.3, 0.5773502691896258], &quot;base_radius&quot;: 0.816496580927726, &quot;normal_end&quot;: [0.41250000000000003, 0.6263734908183775], &quot;normal_start&quot;: [0.55, 0.8351646544245033], &quot;paper&quot;: &quot;04&quot;, &quot;plane_height&quot;: 0.5773502691896258, &quot;question&quot;: 20, &quot;styles&quot;: {&quot;base&quot;: &quot;dash-dot&quot;, &quot;cap&quot;: &quot;solid&quot;, &quot;rest&quot;: &quot;dashed&quot;, &quot;volume&quot;: &quot;hatch&quot;}, &quot;u_axis&quot;: &quot;(1,1,1)/sqrt(3)&quot;, &quot;v_axis&quot;: &quot;(1,-1,0)/sqrt(2)&quot;}</metadata>
<defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="10"><path d="M-2 10 L10 -2 M8 12 L12 8" stroke="#777" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#111"/></marker></defs>
<rect width="1000" height="660" fill="white"/>
<g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111">
<text x="42.000" y="43.000" font-size="23" text-anchor="start">Mock 04 / Q20 - meridional section and normals</text>
<text x="620.000" y="104.000" font-size="20" text-anchor="start">Orthonormal coordinates</text>
<text x="620.000" y="139.000" font-size="18" text-anchor="start">u = (x+y+z)/sqrt(3)</text>
<text x="620.000" y="174.000" font-size="18" text-anchor="start">v along (1,-1,0)/sqrt(2)</text>
<text x="620.000" y="214.000" font-size="18" text-anchor="start">Sphere: v^2 + u^2 = 1</text>
<text x="620.000" y="249.000" font-size="18" text-anchor="start">Plane: u = d = 1/sqrt(3)</text>
<text x="620.000" y="284.000" font-size="18" text-anchor="start">A = (-sqrt(2/3), d)</text>
<text x="620.000" y="319.000" font-size="18" text-anchor="start">B = ( sqrt(2/3), d)</text>
<text x="620.000" y="354.000" font-size="18" text-anchor="start">C = (0,1),   O = (0,0)</text>
<text x="620.000" y="405.000" font-size="18" text-anchor="start">Thick solid: cap Sigma</text>
<text x="620.000" y="440.000" font-size="18" text-anchor="start">Thin dashed: remaining sphere</text>
<text x="620.000" y="475.000" font-size="18" text-anchor="start">Dash-dot: disk S0 in section</text>
<text x="620.000" y="510.000" font-size="18" text-anchor="start">Hatch: enclosed volume Omega</text>
<text x="620.000" y="557.000" font-size="18" text-anchor="start">n_in = -r  (toward O)</text>
<text x="620.000" y="592.000" font-size="18" text-anchor="start">n_0,out = -e_u  (below S0)</text>
