<title id="mock01-title">Mock 01 Q19: the domain between two parabolas</title>
<desc id="mock01-desc">D has 0 less than or equal to x less than or equal to 1 and x squared less than or equal to y less than or equal to 2x minus x squared. The endpoints are (0,0) and (1,1). This is a scalar planar domain, with no surface normal.</desc>
